<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Let's Dive — watercolor shark journey</title>
  <!-- Layout and watercolor scene styling live in css/style.css. -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button class="sound-toggle" type="button" aria-label="Turn sound on" aria-pressed="false" title="Turn sound on">
    <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <path d="M5 12h6l7-6v20l-7-6H5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path class="sound-waves" d="M22 11c2 2 2 8 0 10m4-14c4 4 4 14 0 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path class="sound-off" d="m22 12 6 8m0-8-6 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
  <main class="journey" aria-label="Put on a mask and dive into a watercolor ocean">
    <section class="stage">
      <img class="scene surface" src="assets/shark-intro-ocean-surface-v1.png" alt="A watercolor sea sparkles beneath a pale sky.">
      <img class="scene waterline" src="assets/shark-intro-waterline-v1.png" alt="">
      <img class="scene reef" src="assets/shark-intro-empty-reef-v1.png" alt="">
      <img class="scene shark" src="assets/shark-scrollworld-style-frame-v1.png" alt="A blacktip reef shark glides into a bright coral reef.">
      <div class="wash" aria-hidden="true"></div>
      <div class="sparkle-field" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="mask-group">
        <img class="lens-ocean" src="assets/shark-intro-empty-reef-v1.png" alt="">
        <div class="lens-sheen" aria-hidden="true"></div>
        <img class="mask-rim" src="assets/shark-intro-watercolor-diving-mask-v1.png" alt="">
        <span class="drop a" aria-hidden="true"></span><span class="drop b" aria-hidden="true"></span>
        <span class="drop c" aria-hidden="true"></span><span class="drop d" aria-hidden="true"></span>
        <h1 class="title">lets dive!</h1>
      </div>
      <div class="spray" aria-hidden="true"></div>
      <div class="entry-splash" aria-hidden="true"></div>
      <div class="bubbles" aria-hidden="true"><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i></div>
      <div class="cue" aria-hidden="true"></div>
      <div class="whale-stage" aria-hidden="true">
        <img class="whale-frame whale-blacktip" src="assets/shark-scrollworld-style-frame-v1.png" alt="">
        <img class="whale-frame whale-whales" src="assets/storyboard/shark-storyboard-whale-sharks-top-v3.png" alt="Looking down through sunlit water at the spotted backs of three whale sharks.">
        <img class="whale-animation" src="assets/video/blacktip-to-whales-frames/frame-001.jpg" alt="">
        <div class="whale-water" aria-hidden="true"></div>
        <div class="whale-veil" aria-hidden="true"></div>
        <div class="whale-light" aria-hidden="true"></div>
        <div class="whale-bubbles" aria-hidden="true"></div>
      </div>
      <div class="whale-hammer-stage" aria-hidden="true">
        <img class="whale-hammer-fallback" src="assets/storyboard/shark-storyboard-whale-sharks-top-v3.png" alt="">
        <img class="hammer-animation" src="assets/video/whales-to-hammerhead-frames/frame-001.jpg" alt="">
      </div>
      <div class="deep-stage" aria-hidden="true">
        <img class="deep-frame hammerhead-frame" src="assets/storyboard/shark-storyboard-hammerhead-approach-v1.png" alt="A hammerhead approaches through blue water.">
        <img class="deep-frame great-white-belly" src="assets/storyboard/shark-storyboard-great-white-body-v3.png" alt="">
        <img class="deep-frame great-white-eye" src="assets/storyboard/shark-storyboard-great-white-body-v3.png" alt="">
        <img class="deep-frame great-white-frame" src="assets/storyboard/shark-storyboard-great-white-body-v3.png" alt="A great white glides through colder, darker water.">
        <img class="deep-frame sixgill-frame" src="assets/storyboard/shark-storyboard-sixgill-scary-close-v1.png" alt="A sixgill shark emerges from the dark.">
        <img class="deep-frame tooth-frame" src="assets/storyboard/shark-storyboard-megalodon-tooth-v1.png" alt="A giant ancient tooth rests on the ocean floor.">
        <img class="deep-frame mouth-frame" src="assets/storyboard/shark-storyboard-megalodon-jumpscare-v1.png" alt="A vision of an ancient megalodon mouth rushes forward.">
        <img class="deep-frame suspense-frame" src="assets/storyboard/shark-storyboard-megalodon-suspense-hold-v1.png" alt="Dark water holds one bubble in silence.">
        <img class="deep-frame return-frame" src="assets/storyboard/shark-storyboard-megalodon-calm-return-v1.png" alt="The calm seabed returns, with a single fossil tooth.">
        <div class="depth-wash" aria-hidden="true"></div>
        <div class="deep-current" aria-hidden="true"></div>
        <div class="deep-particles" aria-hidden="true"></div>
        <div class="deep-ink" aria-hidden="true"></div>
      </div>
      <p class="sr-only">Scroll down to put on the mask, splash into the reef, follow the sharks into darker water, witness an ancient vision, and return to the quiet seabed. Scroll back to reverse the journey.</p>
    </section>
    <div class="reduced-ending" role="img" aria-label="A blacktip reef shark in a watercolor coral reef"></div>
    <div class="reduced-whales" role="img" aria-label="The spotted backs of whale sharks beneath the sunlit surface"></div>
    <div class="reduced-deep" role="img" aria-label="The calm deep seabed with a megalodon fossil tooth"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
  <!-- js/app.js reads scroll position and moves the scene layers. -->
  <script src="js/app.js"></script>
</body>
</html>
